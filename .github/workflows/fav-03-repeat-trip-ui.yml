name: FAV-03 repeat-trip UI test

on:
  pull_request:
    branches:
      - master
      - feature/**
    paths:
      - ".github/workflows/fav-03-repeat-trip-ui.yml"
      - "app/src/main/java/ru/transferservis/app/ui/history/**"
      - "app/src/main/java/ru/transferservis/app/ui/home/**"
      - "app/src/main/java/ru/transferservis/app/domain/model/RouteDraft.java"
      - "app/src/main/res/layout/item_trip_history.xml"
      - "app/src/main/res/values/strings.xml"
      - "app/src/androidTest/java/ru/transferservis/app/ui/history/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fav-03-repeat-trip-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ui:
    name: History to Home repeat route on disposable API 35 AVD
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v6
      - name: Enable KVM access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run FAV-03 instrumented test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: |
            chmod +x ./gradlew
            ./gradlew :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=ru.transferservis.app.ui.history.RepeatTripHistoryUiTest --stacktrace
      - name: Upload instrumentation reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: fav03-repeat-trip-ui-reports
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
          if-no-files-found: ignore
          retention-days: 14
