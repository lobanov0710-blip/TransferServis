name: UX-01 approved passenger UI
on:
  pull_request:
    branches: [master, docs/ux-01-approved-mockups-20261127]
    paths: ["app/**", "scripts/ux01-ui-check.sh", ".github/workflows/ux01-approved-ui.yml"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ux01-${{ github.ref }}
  cancel-in-progress: true
jobs:
  ui:
    name: Isolated API35 UX and recovery
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v6
      - name: Compile isolated UI tests
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Enable KVM on disposable runner
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: bash scripts/ux01-ui-check.sh
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: ux01-api35-screens-and-tests
          path: build/ux01/
          if-no-files-found: warn
          retention-days: 14
