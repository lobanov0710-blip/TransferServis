name: FAV-02 favorites UI instrumentation

on:
  pull_request:
    branches:
      - master
      - feature/**
    paths:
      - ".github/workflows/fav-02-ui.yml"
      - "app/src/main/java/ru/transferservis/app/ui/favorites/**"
      - "app/src/main/java/ru/transferservis/app/ui/home/**"
      - "app/src/main/java/ru/transferservis/app/data/repository/FavoritesRepository.java"
      - "app/src/main/java/ru/transferservis/app/domain/validation/FavoriteAddressValidator.java"
      - "app/src/main/res/layout/fragment_favorites.xml"
      - "app/src/main/res/layout/item_favorite_address.xml"
      - "app/src/main/res/layout/dialog_favorite_address.xml"
      - "app/src/main/res/layout/fragment_home.xml"
      - "app/src/main/res/navigation/nav_graph.xml"
      - "app/src/androidTest/java/ru/transferservis/app/ui/favorites/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fav-02-ui-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ui:
    name: Favorite address pick on isolated Android 15
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v6
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Instrumented favorites screen test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: |
            chmod +x ./gradlew
            ./gradlew :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=ru.transferservis.app.ui.favorites.FavoriteAddressFlowUiTest --stacktrace
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: fav02-ui-reports
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
          if-no-files-found: ignore
          retention-days: 14
