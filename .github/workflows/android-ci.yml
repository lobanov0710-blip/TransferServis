name: Android CI

on:
  push:
    # Feature/fix branches already get a PR run. Avoid duplicate push runs.
    branches:
      - master
  pull_request:
    # Release validation is re-enabled when a draft becomes ready to merge.
    types: [opened, reopened, synchronize, edited, ready_for_review, converted_to_draft]
    branches:
      - master
      # Проверяем также черновики PR в рабочих ветках до слияния.
      - feature/**
      - fix/**
  # Explicit full pipeline is available on demand, including for draft branches.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Test, lint and build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Test, lint, assemble debug APK and instrumentation tests
        # One Gradle invocation de-duplicates shared task dependencies.
        run: ./gradlew :app:testDebugUnitTest :app:lintDebug :app:assembleDebug :app:assembleDebugAndroidTest --stacktrace

      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: android-ci-reports
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-debug.html
            app/build/reports/lint-results-debug.xml
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v6
        with:
          name: transfer-servis-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
  release_gate:
    name: Unsigned Release verification (no publishing)
    # Draft PRs are not mergeable; run full Release verification once ready,
    # on default-branch pushes, or via explicit manual dispatch.
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Run Release tests, lint and build unsigned APK
        run: ./gradlew :app:testReleaseUnitTest :app:lintRelease :app:assembleRelease --stacktrace

      - name: Assert Release APK is present and NOT signed
        shell: bash
        run: |
          set -euo pipefail
          apk="app/build/outputs/apk/release/app-release-unsigned.apk"
          test -s "$apk"
          apksigner="$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -type f -name apksigner | sort -V | tail -n 1)"
          test -n "$apksigner"
          if "$apksigner" verify "$apk" >/dev/null 2>&1; then
            echo "ERROR: Release APK unexpectedly has a valid signature"
            exit 1
          fi
          echo "UNSIGNED_RELEASE_APK_VERIFIED=True"
          echo "No signed APK is uploaded or published."

      - name: Upload Release test and lint reports only
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: release-gate-reports
          path: |
            app/build/reports/tests/testReleaseUnitTest/
            app/build/reports/lint-results-release.html
            app/build/reports/lint-results-release.xml
          if-no-files-found: ignore
          retention-days: 14
